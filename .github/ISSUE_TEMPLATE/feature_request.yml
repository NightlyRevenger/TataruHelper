name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to be able to do
      description: Describe the situation first, then the idea. Several people can then think of the best way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now instead
      description: Workarounds or other tools you tried.
    validations:
      required: false
